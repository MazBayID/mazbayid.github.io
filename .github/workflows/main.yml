name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check backend Edge Functions
        run: |
          deno check firmware-builder/supabase/functions/firmware-build/index.ts
          deno check firmware-builder/supabase/functions/firmware-build-callback/index.ts

      - name: Run Firmware Builder regression tests
        run: python -m unittest discover -s tests -p test_firmware_builder.py -v
