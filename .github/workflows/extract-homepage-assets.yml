name: Extract homepage image crops

on:
  push:
    branches: [main]
    paths:
      - "assets/assets.png"
      - "scripts/extract_homepage_assets.py"
      - ".github/workflows/extract-homepage-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-image-crops
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Export lossless WebP crops
        run: python scripts/extract_homepage_assets.py

      - name: Commit generated crops
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mascot/octocat-hero.webp assets/icons/puzzle-piece.webp
          if git diff --cached --quiet; then
            echo "Homepage image crops are already up to date."
            exit 0
          fi
          git commit -m "Generate optimized homepage image crops"
          git push origin HEAD:main
