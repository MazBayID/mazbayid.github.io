<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran NekOS</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10111a;color:#f3f4ff;font:16px system-ui}main{max-width:420px;margin:20px;padding:28px;border:1px solid #34384e;border-radius:20px;background:#191c2b}h1{font-size:25px}p{color:#b2bad0;line-height:1.6}b{color:#9ff0d3}</style><main><h1>Kembali ke NekOS</h1><p>Pembayaranmu sedang diverifikasi oleh server. Kembali ke aplikasi NekOS, buka <b>Settings → Skins → Official Skin Store</b>, lalu tekan <b>CHECK PAYMENT &amp; INSTALL</b>.</p><p>Skin hanya akan diunduh setelah Midtrans mengonfirmasi pembayaran. Jangan bagikan tautan unduhan karena paket tetap privat.</p></main></html>
